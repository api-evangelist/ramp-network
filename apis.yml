aid: ramp-network
name: Ramp Network
description: 'Ramp Network (Ramp Swaps Ltd) is a London-headquartered fiat-to-crypto
  on-ramp and off-ramp provider that lets wallets, dApps, exchanges and consumer apps
  embed crypto purchase, sale and swap flows without becoming a regulated money-services
  business themselves. Integrators embed the Ramp Instant widget (overlay, embedded,
  hosted or auto variant) via the TypeScript/JavaScript SDK or the native Android,
  iOS, React Native and Flutter SDKs, and drive it from a public REST "Host API" at
  https://api.rampnetwork.com/api that exposes available on-ramp and off-ramp assets
  with live prices, supported fiat currencies, payment methods, payout methods, purchase
  and off-ramp sale quotations, and purchase/sale status lookup. Transaction lifecycle
  is delivered back to the integrator over ECDSA-signed webhooks and SDK events. Ramp
  Network is registered with the UK FCA as a cryptoasset firm, authorised as a Crypto
  Asset Service Provider by the Central Bank of Ireland, registered as an MSB with
  FinCEN, and holds SOC 2 Type 1 certification.'
