- aid: ramp-network-instant-sdk
  name: Ramp Instant SDK and Widget
  description: 'Client-side integration surface for Ramp Network. The Ramp Instant
    SDK renders the Ramp widget in overlay, embedded, hosted, mobile or auto variants
    and emits a typed event stream (WIDGET_CLOSE, WIDGET_CONFIG_DONE, WIDGET_CONFIG_FAILED,
    PURCHASE_CREATED, OFFRAMP_SALE_CREATED and the close-request events). Configuration
    is passed as SDK options or as URL search parameters in hosted mode, covering
    hostApiKey, hostAppName, enabledFlows, userAddress, defaultAsset, selectedCountryCode,
    webhookStatusUrl, offrampWebhookV3Url, finalUrl and useSendCryptoCallback. Shipped
    for web, Android, iOS, React Native and Flutter.'
  humanURL: https://docs.rampnetwork.com/sdk-reference
  baseURL: https://app.rampnetwork.com
