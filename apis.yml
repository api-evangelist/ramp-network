apis:
- aid: ramp-network-host-api
  name: Ramp Network Host API
  description: 'Public REST API used alongside the Ramp Instant widget. Exposes available
    on-ramp assets and prices, off-ramp assets and prices, supported fiat currencies,
    payment methods, payout methods, on-ramp purchase quotations, off-ramp transaction
    quotations, and purchase / sale status lookup by id plus view token. Current version
    is v3; v1 and v2 remain documented and served on the same base path. JSON in, JSON
    out; errors return a JSON object with a `code` property. All endpoints are rate
    limited by origin IP.'
  humanURL: https://docs.rampnetwork.com/rest-api-v3-reference
